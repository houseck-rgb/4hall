  .pending{display:flex;align-items:flex-end;justify-content:center;pointer-events:none;}

  @media (hover:hover){

    position:fixed; left:0; right:0; bottom:0;
    display:none;
    align-items:center; gap:10px;
    background:#14171F; color:#fff;
    padding:12px 16px;
    font-family:sans-serif;
    z-index:999;
  }
  #installBar img{ width:32px; height:32px; border-radius:8px; }
  #installBar .txt{ flex:1; font-size:13px; }
  #installBar button{
    background:#C9A050; color:#14171F; border:none;
    font-weight:700; font-size:13px;
    padding:8px 14px; border-radius:20px;
  }
</style>

<body>

<div id="installBar">
  <img src="icon-96.png" alt="아이콘">
  <div class="txt">홈 화면에 앱 설치하기</div>
  <button id="installBtn">설치</button>
</div>

<script>
  if(location.search.indexOf('debug') > -1){ document.body.classList.add('debug'); }

  // 서비스워커 등록 (설치 가능 요건 충족 + 오프라인 캐시)
  if('serviceWorker' in navigator){
    window.addEventListener('DOMContentLoaded', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('서비스워커 등록 실패:', err);
      });
    });
  }

  // 설치 프롬프트 처리
  let deferredPrompt = null;
  const bar = document.getElementById('installBar');
  const btn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    bar.style.display = 'flex';
  });

  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(isIOS && !standalone){
    bar.querySelector('.txt').textContent = 'Safari에서 공유 → 홈 화면에 추가로 설치하세요.';
    btn.textContent = '닫기';
    bar.style.display = 'flex';
  }

  btn.addEventListener('click', () => {
    if(isIOS){ bar.style.display = 'none'; return; }
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(() => {
      deferredPrompt = null;
      bar.style.display = 'none';
    });
  });

  window.addEventListener('appinstalled', () => {
    bar.style.display = 'none';
  });
</script>

</body>
